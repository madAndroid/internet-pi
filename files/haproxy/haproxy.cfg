#    http-request redirect location /display/ if { path / }	
#    server rock 192.168.88.250:9330 maxconn 100 weight 10 cookie rock check

backend solar.int.stangl.co.za
    balance roundrobin
    server solar 192.168.88.149:80 check

backend k8s-api.int.stangl.co.za
    mode tcp
    #option tcplog
    option tcp-check
        timeout server 300000
    balance roundrobin
    default-server inter 10s downinter 5s rise 2 fall 2 slowstart 60s maxconn 250 maxqueue 256 weight 100
        #server apiserver1 k8s-master-01.int.stangl.co.za:6443 check
        #server apiserver2 k8s-master-02.int.stangl.co.za:6443 check
        #server apiserver3 k8s-master-03.int.stangl.co.za:6443 check
        #server apiserver4 k8s-master-04.int.stangl.co.za:6443 check
        #server apiserver5 k8s-master-05.int.stangl.co.za:6443 check
        server apiserver1 192.168.88.121:6443 check
        server apiserver2 192.168.88.122:6443 check
        server apiserver3 192.168.88.123:6443 check
        server apiserver4 192.168.88.124:6443 check
        server apiserver5 192.168.88.125:6443 check

backend roon-display-api_ipvANY
     mode				http
     id					104
     log				global
     http-check				send meth HEAD uri /display
     timeout connect			30000
     timeout server			30000
     retries				3
     load-server-state-from-file	global
     option				httpchk
     server				roon-rock 192.168.88.210:9330 id 103 check inter 1000  

backend roon-display_ipvANY
     mode				http
     id					102
     log				global
     http-check				send meth HEAD uri /display
     timeout connect			30000
     timeout server			30000
     retries				3
     load-server-state-from-file	global
     option				httpchk
     server				local-roon-proxy 127.0.0.1:9330 id 103 check inter 1000
