---
- name: Remove legacy hand-added backup jobs from root's personal crontab.
  # These are now managed declaratively in /etc/cron.d/zimaboard-backups below;
  # strip the old unmanaged lines so the jobs don't run twice.
  ansible.builtin.lineinfile:
    path: /var/spool/cron/crontabs/root
    regexp: 'bin/zimaboard-(file|data)-backup\.sh'
    state: absent
  failed_when: false

- name: Schedule the Zimaboard backup jobs.
  ansible.builtin.cron:
    name: "{{ item.name }}"
    user: root
    cron_file: zimaboard-backups
    minute: "{{ item.minute }}"
    hour: "{{ item.hour }}"
    # The scripts tee their own output to ~/log, so cron's copy is discarded.
    job: "{{ backup_bin_dir }}/{{ item.script }} > /dev/null 2>&1"
  loop: "{{ backup_jobs }}"
